{% extends "base.html" %}

{% block title %}Login - SG Technologies POS{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <div class="text-center mb-3">
            <h1 style="font-size: 2rem; color: var(--highlight);">💳 SG Technologies</h1>
            <p style="color: var(--text-secondary);">Point of Sale System</p>
        </div>
        
        <h2 class="card-title text-center mb-2">Login</h2>
        
        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="employee_id">Employee ID</label>
                <input type="text" class="form-control" id="employee_id" name="employee_id" 
                       placeholder="Enter your ID (e.g., 110001)" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Login
            </button>
        </form>
    </div>
    
    <p class="text-center" style="margin-top: 1rem; color: var(--text-secondary); font-size: 0.875rem;">
        Reengineered POS System v2.0
    </p>
</div>
{% endblock %}
