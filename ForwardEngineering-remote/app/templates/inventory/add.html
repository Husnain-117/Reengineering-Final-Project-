{% extends "base.html" %}

{% block title %}Add Item - SG Technologies POS{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 class="mb-3">Add New Item</h1>
    
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Item Code *</label>
                <input type="text" name="item_code" class="form-control" required placeholder="e.g., 1100">
            </div>
            
            <div class="form-group">
                <label class="form-label">Item Name *</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Apple">
            </div>
            
            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">Price *</label>
                    <input type="number" name="price" class="form-control" step="0.01" min="0" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Initial Quantity</label>
                    <input type="number" name="quantity" class="form-control" min="0" value="0">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" value="General" placeholder="e.g., Grocery">
            </div>
            
            <div class="form-group">
                <label class="form-label">
                    <input type="checkbox" name="is_rentable"> This item can be rented
                </label>
            </div>
            
            <div class="flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Add Item</button>
                <a href="{{ url_for('inventory.list_items') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
